{# TODO(benkraft): This isn't that different from the non-theme one, dedupe #}
<div id="loginbox">

  <div class="logged_in hidden d-flex gap-2 align-items-center">
    <a href="/myesp/profile/" class="nav-link username">
      <i class="bi bi-person" aria-hidden="true"></i> Hello, <span id="user_first_name"></span>!
    </a>
    <a class="btn btn-sm btn-outline-light" href="/myesp/signout">Logout</a>
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-light dropdown-toggle" data-bs-toggle="dropdown"
              aria-expanded="false" aria-label="Account options">
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="/myesp/accountmanage/">Manage Account</a></li>
        <li><a class="dropdown-item" href="/myesp/loginhelp.html">Help</a></li>
        <li><a class="dropdown-item" href="https://www.learningu.org/about/privacy/" target="_blank" rel="noopener">Privacy Policy</a></li>
      </ul>
    </div>
  </div>

  <div class="not_logged_in hidden">
    <form name="loginform" id="loginform" method="post" action="/myesp/login/"
          class="d-flex gap-1 align-items-center flex-wrap">
      <input type="hidden" name="next" value="{{ request.path }}" />
      <label class="visually-hidden" for="user">Username</label>
      <input type="text" name="username" id="user" size="8" value="" placeholder="Username"
             maxlength="255" class="form-control form-control-sm inputbox" />
      <label class="visually-hidden" for="pass">Password</label>
      <input type="password" name="password" id="pass" size="8" value="" placeholder="Password"
             maxlength="255" class="form-control form-control-sm inputbox" />
      <button class="btn btn-sm btn-primary" id="gologin" type="submit">Login</button>
      <div class="dropdown">
        <button class="btn btn-sm btn-secondary dropdown-toggle" data-bs-toggle="dropdown"
                aria-expanded="false" aria-label="Account options">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/myesp/register">Register</a></li>
          <li><a class="dropdown-item" href="/myesp/passwdrecover/">Forgot Password</a></li>
          <li><a class="dropdown-item" href="/myesp/loginhelp.html">Help</a></li>
          <li><a class="dropdown-item" href="https://www.learningu.org/about/privacy/" target="_blank" rel="noopener">Privacy Policy</a></li>
        </ul>
      </div>
    </form>
  </div>
</div>
