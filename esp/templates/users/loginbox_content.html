<div id="loginbox">

  {% if login_result %}
    <div class="navbar" role="status" aria-live="polite">{{ login_result }}</div>
  {% endif %}

<div class="logged_in hidden">
  <ul class="nav">
    <li>
      <a id="loginbox_user_name">Hello, <span id="user_first_name"></span>!</a>
    </li>
    <li>
      <a href="/myesp/signout" class="btn btn-info" style="margin-right:0px;">Logout</a>
      <div class="dropdown d-inline-block">
        <button class="btn btn-info dropdown-toggle" data-bs-toggle="dropdown"
                aria-expanded="false" aria-label="Account options" style="margin-left:0px;">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/myesp/accountmanage/">Manage Account</a></li>
          <li><a class="dropdown-item" href="/myesp/loginhelp.html">Help</a></li>
          <li>
            <a class="dropdown-item" href="https://www.learningu.org/about/privacy/" target="_blank" rel="noopener">
              Privacy Policy
            </a>
          </li>
        </ul>
      </div>
    </li>
  </ul>
</div>

<div class="not_logged_in hidden">
  <form name="loginform" id="loginform" method="post" action="/myesp/login/" class="d-flex gap-1 align-items-center flex-wrap">
    <!-- input type="hidden" name="next" value={-{ request.path }}" / -->
    <label class="visually-hidden" for="user">Username</label>
    <input type="text" name="username" id="user" size="8" value="" placeholder="Username" maxlength="255" class="form-control form-control-sm inputbox" />
    <label class="visually-hidden" for="pass">Password</label>
    <input type="password" name="password" id="pass" size="8" value="" placeholder="Password" maxlength="255" class="form-control form-control-sm inputbox" />
    <button class="btn btn-primary btn-sm" id="gologin" type="submit"> Login </button>
    <div class="dropdown d-inline-block">
      <button class="btn btn-primary btn-sm dropdown-toggle" data-bs-toggle="dropdown"
              aria-expanded="false" aria-label="Account options" style="margin-left:0px;">
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="/myesp/register">Register</a></li>
        <li><a class="dropdown-item" href="/myesp/passwdrecover/">Forgot Password</a></li>
        <li><a class="dropdown-item" href="/myesp/loginhelp.html">Help</a></li>
        <li><a class="dropdown-item" href="https://www.learningu.org/about/privacy/" target="_blank" rel="noopener">Privacy Policy</a></li>
      </ul>
    </div>
  </form>
</div>
</div>
